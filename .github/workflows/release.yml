name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fijar versión desde el tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $t = Get-Content Cargo.toml -Raw
          $t = [regex]::Replace($t, '(?m)^version = ".*"', "version = `"$v`"", 1)
          Set-Content Cargo.toml $t -NoNewline

      - name: Compilar
        run: cargo build --release

      - name: Descargar yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile bin/yt-dlp.exe

      - name: Instalar NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }

      - name: Crear instalador
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source ?? 'C:\Program Files (x86)\NSIS\makensis.exe'
          & $nsis "/DVERSION=$v" installer/temazoo.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis falló" }

      - uses: actions/upload-artifact@v4
        with:
          name: Temazoo-Setup
          path: dist/*.exe

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

[package]
name = "temazoo"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.37.0", features = ["image", "http"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
raw-window-handle = "0.6"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde_json = "1.0.154"
souvlaki = "0.9.3"
symphonia = { version = "0.6", default-features = false, features = ["mkv", "isomp4", "aac"] }
symphonia-adapter-opus-rs = "0.1.1"
tao = "0.37.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "macros", "time"] }
wry = "0.57.1"
ytmusicapi = "0.4"

[build-dependencies]
winresource = "0.1.34"





